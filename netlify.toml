[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  timeout = 26

# Nitro writes the server to .netlify/functions-internal on this preset.
# DATABASE_URL and BETTER_AUTH_* must be set in the Netlify UI.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/open"
  to = "/shop/open"
  status = 301
