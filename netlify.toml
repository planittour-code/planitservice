[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"


# Nitro writes the server to .netlify/functions-internal on this preset.
# DATABASE_URL and BETTER_AUTH_* must be set in the Netlify UI.
# Mail: RESEND_API_KEY plus EMAIL_FROM on mail.planitservice.com.
# Inbound estimate replies: Resend webhook → https://planitservice.com/api/resend/webhook

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/open"
  to = "/shop/open"
  status = 301
  force = true

[[redirects]]
  from = "/start"
  to = "/homeowner"
  status = 301
  force = true

[[redirects]]
  from = "/my"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/homeowners"
  to = "/homeowner"
  status = 301
  force = true
