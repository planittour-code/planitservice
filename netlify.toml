[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"


# Nitro writes the server to .netlify/functions-internal on this preset.
# DATABASE_URL and BETTER_AUTH_* must be set in the Netlify UI.
# Password reset mail: set RESEND_API_KEY (and optional EMAIL_FROM).

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/open"
  to = "/shop/open"
  status = 301

[[redirects]]
  from = "/start"
  to = "/homeowner"
  status = 301
