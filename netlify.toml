[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # npm 10.9 crashes (ERR_INVALID_ARG_TYPE in reify rollback) when upgrading
  # TanStack over a cached node_modules; npm 11 installs cleanly.
  NPM_VERSION = "11.21.1"


# Nitro writes the server to .netlify/functions-internal on this preset.
# DATABASE_URL and BETTER_AUTH_* must be set in the Netlify UI.
# Mail: RESEND_API_KEY plus EMAIL_FROM on mail.planitservice.com.
# Albin calendar: GOOGLE_CALENDAR_CREDENTIALS (service account JSON) invited on albin@guttersplus.com.
# Voice agent tools: VOICE_AGENT_SECRET as Bearer token on /api/voice/*.
# Portfolio map tiles: CARTO_API_KEY (raster basemaps; /api/map-tile attaches it).
# Inbound estimate replies: Resend webhook → https://planitservice.com/api/resend/webhook

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/open"
  to = "/shop/open"
  status = 301
  force = true

[[redirects]]
  from = "/start"
  to = "/homeowner"
  status = 301
  force = true

[[redirects]]
  from = "/my"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/homeowners"
  to = "/homeowner"
  status = 301
  force = true

# Scanner bait — serve a 12-byte static 404 instead of the app HTML.
[[redirects]]
  from = "/wordpress"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp/*"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/blog"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-json"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/index.php"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.git"
  to = "/gone.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/gone.txt"
  status = 404
  force = true

[[headers]]
  for = "/gone.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex, nofollow"
    Content-Type = "text/plain; charset=utf-8"
